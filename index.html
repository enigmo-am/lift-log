<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Lift Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>Lift Log</h1>
  <div id="streakBadge" class="streak-badge" title="Current streak"></div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="today" class="active"><span>●</span>Today</button>
  <button data-tab="history"><span>☰</span>History</button>
  <button data-tab="progress"><span>↗</span>Progress</button>
  <button data-tab="stats"><span>▦</span>Stats</button>
  <button data-tab="settings"><span>⚙</span>Settings</button>
</nav>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="muscles.js"></script>
<script src="app.js"></script>
</body>
</html>
