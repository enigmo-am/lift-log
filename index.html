<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Lift Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<header class="topbar">
  <h1>Lift Log</h1>
  <div class="row"><button id="statusChip" class="status-chip" title="Backup status"></button><button id="modeBtn" class="icon-btn" title="Light / dark mode">🌙</button><div id="streakBadge" class="streak-badge" title="Current streak"></div></div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="home" class="active"><span>⌂</span>Home</button>
  <button data-tab="activity"><span>↗</span>Activity</button>
  <button data-tab="stats"><span>▦</span>Stats</button>
  <button data-tab="friends"><span>👥</span>Friends</button>
  <button data-tab="profile"><span>☺</span>Profile</button>
</nav>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="avatars.js"></script>
<script src="muscles.js"></script>
<script src="figure.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
